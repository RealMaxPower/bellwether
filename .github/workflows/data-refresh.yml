name: Monthly data refresh

on:
  # ISM publishes its Manufacturing Report on the first business day of the
  # month. We refresh on the 5th to give FRED time to mirror.
  schedule:
    - cron: "0 14 5 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The four Wayback scrapes sleep between every request and re-probe the
    # structural 2015-04 → 2020-05 gap on each run, so the job takes tens of
    # minutes. A job timeout kills the run outright — continue-on-error on the
    # scrape steps does not protect against it — so leave generous headroom.
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Fail loudly and immediately rather than 40 minutes into the scrapes —
      # the last run got all the way to the final step before dying on a
      # missing permission, throwing away the whole scrape.
      - name: Check required secrets are configured
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATA_REFRESH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          missing=0
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY repository secret is not set."
            echo "Create one at https://fred.stlouisfed.org/docs/api/api_key.html,"
            echo "then add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "$DATA_REFRESH_TOKEN" ]; then
            echo "::error::DATA_REFRESH_TOKEN repository secret is not set."
            echo "Fine-grained PAT scoped to this repo only, with Contents:"
            echo "Read and write + Pull requests: Read and write."
            missing=1
          fi
          exit $missing

      - name: Pull latest FRED snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run refresh-data

      # FRED only carries INDPRO, IPMAN and FEDFUNDS — it dropped the ISM PMI
      # series in 2016. The series the freshness tests actually gate on
      # (merged PMI, Wayback NMI) come from the importers below, so a refresh
      # that skipped them left CI red no matter how often it ran.
      - name: Backfill recent ISM prints from PRNewswire
        run: npm run import-prnewswire

      # Wayback is the citation channel for the archived ISM releases. It is
      # third-party and rate-limited, so a bad day upstream must not fail the
      # whole refresh — the importers are incremental, and the freshness
      # thresholds in check-data are the real gate on going stale.
      - name: Refresh Wayback Manufacturing archive
        continue-on-error: true
        run: |
          npm run import-wayback
          npm run import-wayback-subindices

      - name: Refresh Wayback Services archive
        continue-on-error: true
        run: |
          npm run import-wayback-nmi
          npm run import-wayback-nmi-subindices

      - name: Run strict data checks
        env:
          STRICT_DATA_CHECKS: "1"
        run: npm run check-data

      - name: Run full test suite
        run: npm test

      - name: Open PR with refreshed data
        uses: peter-evans/create-pull-request@v6
        with:
          # Deliberately NOT the default GITHUB_TOKEN. Letting Actions open PRs
          # requires the repo-wide "Allow GitHub Actions to create and approve
          # pull requests" switch, and that same switch would let any workflow
          # holding pull-requests:write *approve* a PR — which on this repo
          # would satisfy main's 1-required-review branch protection. A
          # dedicated fine-grained PAT keeps that switch off.
          #
          # Side benefit: PRs opened with a PAT do trigger CI, whereas ones
          # opened with GITHUB_TOKEN deliberately do not (recursion guard), so
          # data PRs now get checked instead of arriving with no status at all.
          token: ${{ secrets.DATA_REFRESH_TOKEN }}
          commit-message: "chore(data): monthly data refresh"
          branch: data-refresh/${{ github.run_id }}
          title: "Monthly data refresh"
          body: |
            Automated FRED + PRNewswire + Wayback refresh.

            Note: the Wayback steps are `continue-on-error`. If either was
            skipped, the archived series are unchanged in this PR — the
            freshness thresholds in `npm run check-data` are what fail if
            that keeps happening.

            **Maintainer checklist before merging:**
            - [ ] Read this month's ISM news release and append a row to `data/ism-spot-checks.json`
            - [ ] Re-run `npm run check-data` locally to confirm reconciliation passes
            - [ ] Eyeball the diff for any series that looks wildly off prior values
          # Every file the steps above write. Listed explicitly rather than as
          # a data/*.json glob so a new scratch file in data/ can't silently
          # ride along into a data PR. The .wayback-*-cdx-cache entries are
          # deliberate — data/CONTRIBUTING.md asks for them to be committed
          # alongside data changes.
          add-paths: |
            data/fred/*.json
            data/pmi-curated.json
            data/nmi-curated.json
            data/pmi-wayback.json
            data/pmi-subindices-wayback.json
            data/nmi-wayback.json
            data/nmi-subindices-wayback.json
            data/.wayback-cdx-cache.json
            data/.wayback-nmi-cdx-cache.json
